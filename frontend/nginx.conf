upstream backend {
    server backend:8080;
    keepalive 16;
}

# Behind a TLS proxy (Caddy/Traefik/nginx on the host) the scheme comes from it; otherwise it is ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    # Ordinary requests are small; only the upload endpoints below accept large bodies.
    client_max_body_size 2m;

    # The client address is taken from X-Forwarded-For only when the request comes from a trusted proxy
    # (TRUSTED_PROXY, see docker-compose.yml); a header sent by anyone else is ignored, so rate limits cannot be
    # dodged by inventing an address.
    set_real_ip_from ${TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Every page of the app is index.html. SSI fills in the title, description, link preview, schema.org data and a
    # plain-HTML copy of the content for the address that was opened, so search engines and messengers that do not
    # run JavaScript still see the real page.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        ssi on;
        ssi_silent_errors on;
        sub_filter_once off;
        sub_filter '__PUBLIC_URL__' '${PUBLIC_URL}';
    }

    location ^~ /api/seo/ {
        internal;
        # The fragment is pasted into the page as is, so it must not come back compressed.
        proxy_set_header Accept-Encoding "";
        # A slow backend must not hold the page: on timeout the default tags from index.html are used.
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /robots.txt {
        rewrite ^ /api/seo/robots.txt break;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /sitemap.xml {
        rewrite ^ /api/seo/sitemap.xml break;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location ~ ^/api/admin/(products/\d+/media|settings/company-video/file)$ {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/ {
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /uploads/ {
        include /etc/nginx/snippets/proxy-backend.conf;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Uploaded files are content, never code: no scripts may run even if a file were crafted to contain some.
        add_header Content-Security-Policy "script-src 'none'; object-src 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /video/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # No "$uri/": a public folder named like a page (/cards, /img) must never turn a route into a redirect.
        try_files $uri /index.html;
    }
}
