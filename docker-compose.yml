name: greenleaf

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenleaf}
      POSTGRES_USER: ${POSTGRES_USER:-greenleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-greenleaf}
      DB_USER: ${POSTGRES_USER:-greenleaf}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      STORE_PHONE: ${STORE_PHONE:-+77076173928}
      STORE_WHATSAPP: ${STORE_WHATSAPP:-77076173928}
      STORE_TELEGRAM_URL: ${STORE_TELEGRAM_URL:-https://t.me/+5NLkt7yDuxJlZTUy}
      STORE_INSTAGRAM_URL: ${STORE_INSTAGRAM_URL:-}
      STORE_CITY: ${STORE_CITY:-г. Алматы}
      STORE_ADDRESS: ${STORE_ADDRESS:-ул. Бонапарта 5}
      COMPANY_VIDEO_URL: ${COMPANY_VIDEO_URL:-https://www.youtube.com/watch?v=1g-BeW0y_TE}
      COMPANY_VIDEO_TITLE: ${COMPANY_VIDEO_TITLE:-История Greenleaf, 25 лет на рынке Китая}
      PARTNER_DISCOUNT_PERCENT: ${PARTNER_DISCOUNT_PERCENT:-50}
      DELIVERY_FEE: ${DELIVERY_FEE:-1500}
      FREE_DELIVERY_THRESHOLD: ${FREE_DELIVERY_THRESHOLD:-25000}
    volumes:
      - uploads:/data/uploads
      - ./seed:/seed:ro
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  uploads:
